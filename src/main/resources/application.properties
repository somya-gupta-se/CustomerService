spring.application.name=CUSTOMER-SERVICE
server.port=8585

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

#server.servlet.context-path=/customer-service

management.endpoints.web.exposure.include=*
management.endpoint.info.enabled=true
info.application.name=Banking MVP
info.application.version=1.0.0
info.application.description=Microservices-based banking MVP application Customer Service

spring.datasource.url=jdbc:h2:mem:customerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.config.import=optional:configserver:http://localhost:2525/